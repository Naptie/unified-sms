name: Deploy
run-name: Deploy application
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle application
        # @alicloud/* packages are kept external: they lack __esModule=true so bun's
        # bundler can't correctly resolve their default CJS export at bundle time.
        # They are restored via 'bun install --production' on the server instead.
        run: |
          bun build src/index.ts \
            --target bun \
            --external "@alicloud/dypnsapi20170525" \
            --external "@alicloud/openapi-client" \
            --external "@alicloud/tea-typescript" \
            --external "@alicloud/tea-util" \
            --outfile build/index.js

      - name: Stage artifact
        run: |
          cp package.json build/package.json
          cp bun.lock build/bun.lock

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 7

  deploy:
    name: Deploy via webhook
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Call deployment webhook
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -H "X-Webhook-Token: ${WEBHOOK_TOKEN}" \
          -d "{\"run_id\":\"${RUN_ID}\"}" \
          "${WEBHOOK_URL}"
