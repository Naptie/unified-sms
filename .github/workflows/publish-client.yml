name: Publish Eden Client

on:
  push:
    branches: [main]

# Allow the job to push to the client branch
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bundle all type declarations (including Elysia generics) into a single index.d.ts.
      # --no-check skips tsc type-checking for speed; types are already verified on push.
      - name: Generate type declarations
        run: |
          mkdir -p /tmp/client-dist
          bunx dts-bundle-generator \
            --out-file /tmp/client-dist/index.d.ts \
            --project tsconfig.dts.json \
            --no-check \
            client/src/index.ts

      # Minimal runtime: consumers supply their own @elysia/eden install
      - name: Write runtime
        run: |
          {
            echo "import { treaty } from '@elysia/eden';"
            echo "export const createClient = (baseUrl, config) => treaty(baseUrl, config);"
          } > /tmp/client-dist/index.js

      - name: Write package manifest
        run: |
          node -e "
            process.stdout.write(JSON.stringify({
              name: 'unified-sms-client',
              version: '0.0.0',
              description: 'Typed Eden Treaty client for unified-sms',
              type: 'module',
              main: 'index.js',
              types: 'index.d.ts',
              peerDependencies: {
                '@elysia/eden': '>=1.0.0',
                elysia: '>=1.0.0',
              },
            }, null, 2));
          " > /tmp/client-dist/package.json

      - name: Publish to client branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          cd /tmp/client-dist
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan client
          git add .
          git commit -m "chore: publish client [${SHORT_SHA}]"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin client --force
